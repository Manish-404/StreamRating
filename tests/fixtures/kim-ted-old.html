<html><body><p>Unlike the MPAA we do not assign one inscrutable rating based on age but 3 objective ratings for <strong>SEX/NUDITY</strong>, <strong>VIOLENCE/GORE</strong> &amp; <strong>LANGUAGE</strong> on a scale of 0 to 10, from lowest to highest depending on quantity &amp; context |<a href="/about.htm/#methodologyofnumbers" target="_blank" rel="noopener noreferrer">more</a>|</p></p><p><span style="border-bottom:1px dotted #3C3C3C; color:#3C3C3C; text-decoration:none; font-weight: bold">SEX/NUDITY 8</span> - text</p><p><span style="border-bottom:1px dotted #3C3C3C; color:#3C3C3C; text-decoration:none; font-weight: bold">VIOLENCE/GORE 5</span> - text</p><p><span style="border-bottom:1px dotted #3C3C3C; color:#3C3C3C; text-decoration:none; font-weight: bold">LANGUAGE 10</span> - text</p></body></html>
